{% extends 'base.html' %}
{% load my_tags %}

{% block content %}
<div class="card mb-3">
    {% if article.preview %}
    <img src="{{ article.preview|media_filter }}" class="card-img-top" alt="{{ article.title }}">
    {% else %}
    <img src="/media/placeholder.png" class="card-img-top" alt="Нет фото">
    {% endif %}

    <div class="card-body">
        <h1 class="card-title">{{ article.title }}</h1>
        <p class="card-text">{{ article.content }}</p>
        <a href="{% url 'blog:list' %}" class="btn btn-success">Назад к статьям</a>
    </div>
</div>
{% endblock %}
