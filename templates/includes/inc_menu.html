<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 font-weight-normal text-nowrap  me-4">Мой сад</h5>
    <nav class="d-flex align-items-center w-100 gap-2">
        <a class="p-2 btn btn-outline-success" href="{% url 'catalog:list' %}">Каталог</a>
        <a class="p-2 btn btn-outline-success" href="{% url 'blog:list' %}">Блог</a>
        <a class="p-2 btn btn-outline-success" href="{% url 'catalog:contacts' %}">Контакты</a>
        <div class="ms-auto d-flex align-items-center gap-2">
            {% if user.is_authenticated %}
                <form method="post" action="{% url 'users:logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-success">Выход</button>
                </form>
            {% else %}
                <a class="p-2 btn btn-outline-success" href="{% url 'users:login' %}">Вход</a>
                <a class="p-2 btn btn-outline-success" href="{% url 'users:register' %}">Регистрация</a>
            {% endif %}
        </div>
    </nav>
</div>
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Мой сад</h1>
    <p class="lead">маркетплейс садовых растений</p>
</div>
