{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}

<div class="container">
    <div class="row text-center row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
        {% for product in products %}
        <div class="col d-flex">
            <div class="card w-100 h-100 box-shadow d-flex flex-column pb-3">
                <div class="card-header p-0" style="height: 200px; overflow: hidden;">
                    <img src="{{ product.image | media_filter }}"
                         class="card-img-top w-100 h-100"
                         style="object-fit: cover;"
                         alt="Изображение отсутствует">
                </div>
                <div class="card-body d-flex flex-column justify-content-between p-3">
                    <div class="d-flex flex-column gap-1">
                        <h5 class="card-title m-0 d-flex align-items-center justify-content-center"
                            style="height: 4.8em; line-height: 1.2em; overflow: hidden;">
                            {{ product.name }}
                        </h5>
                    </div>
                </div>
                <div class="mt-2">
                    <h6 class="text-muted m-0 mb-1">Описание</h6>
                    <div style="min-height: 70px;" class="d-flex align-items-center justify-content-center">
                        <p class="card-text m-0 small text-secondary">
                            {{ product.description|truncatechars:100 }}
                        </p>
                    </div>
                </div>
                <div class="px-3 mt-auto">
                    <h2 class="card-title pricing-card-title mb-2">{{ product.price }} ₽</h2>
                    <a class="btn btn-lg btn-block btn-success w-100"
                       href="{% url 'catalog:product_detail' product.pk %}"
                       role="button">Подробнее</a>

                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
