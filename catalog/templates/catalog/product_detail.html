{% extends 'base.html' %}
{% load my_tags %}
{% block content %}

<!-- Ограничиваем карточку по высоте и скрываем всё, что выходит за рамки -->
<div class="card col-xl-10 mx-auto overflow-hidden" style="height: 75vh; max-height: 600px;">
    <div class="row g-0 h-100 align-items-stretch">
        <!-- Левая часть: Фото на всю доступную высоту карточки -->
        <div class="col-md-5 h-100">
            <img src="{{ product.image | media_filter }}"
                 class="w-100 h-100"
                 style="object-fit: cover;"
                 alt="Изображение отсутствует">
        </div>
        <!-- Правая часть: flex-column контейнер на всю высоту -->
        <div class="col-md-7 h-100 d-flex flex-column">
            <!-- Главный контейнер тела, который управляет распределением места -->
            <div class="card-body d-flex flex-column h-100 justify-content-between p-4" style="min-height: 0;">
                <!-- Верхняя текстовая часть (скроллится, ТОЛЬКО если текст не влезает) -->
                <div class="overflow-auto pe-2" style="flex-grow: 1; min-height: 0;">
                    <h3 class="card-title fw-bold mb-3">{{ product.name }}</h3>
                    <h5 class="text-muted fs-6 mb-1">Описание</h5>
                    <p class="card-text mb-4 text-secondary" style="line-height: 1.6;">
                        {{ product.description }}
                    </p>
                    <h5 class="text-muted fs-6 mb-1">Характеристики</h5>
                    <p class="card-text mb-2">
                        <span class="text-muted">Категория: </span>
                        {% if product.category %}</p>
                    <a href="{% url 'catalog:category_products' category_name=product.category.name %}"
                       class="text-success fw-medium ms-1"
                       style="text-decoration: none;"
                       onmouseover="this.style.textDecoration='underline'"
                       onmouseout="this.style.textDecoration='none'">
                        {{ product.category.name }}
                    </a>
                    {% else %}
                    <span class="text-muted small">Без категории</span>
                    {% endif %}
                </div>
                <!-- Нижняя часть с ценой и кнопками (flex-shrink-0 гарантирует, что блок никогда не сожмется и не исчезнет) -->
                <div class="mt-3 pt-3 border-top flex-shrink-0">
                    <!-- Жесткая сетка для цены: делит строку на две равные колонки -->
                    <div class="row g-3 mb-2">
                        <!-- Левая колонка (над кнопкой "Купить") -->
                        <div class="col-6 text-center">
                            <h2 class="card-title pricing-card-title fw-bold m-0 d-inline-block">
                                {{ product.price }} ₽
                            </h2>
                        </div>
                        <!-- Правая колонка (над кнопкой "В каталог") остается пустой, но держит ширину -->
                        <div class="col-6"></div>
                    </div>
                    <!-- Кнопки в такой же жесткой сетке из двух колонок -->
                    <div class="row g-3">
                        <div class="col-6">
                            <button type="button" class="btn btn-lg btn-success w-100 py-2">Купить</button>
                        </div>
                        <div class="col-6">
                            <a class="btn btn-lg btn-outline-success w-100 py-2"
                               href="{% url 'catalog:list' %}"
                               role="button">В каталог</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
